<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SettlementForge</title>

    <!-- ── AI-crawler reservation ────────────────────────────────────────────
      noai / noimageai: this content and its images are reserved against AI-model
      training and AI image ingestion. Belt-and-suspenders with the site-wide
      `X-Robots-Tag: noai, noimageai` + `TDM-Reservation: 1` response headers
      (vercel.json) — the header is the authoritative, JS-independent signal (most
      training crawlers fetch raw HTML and never run the SPA), and robots.txt names
      the specific AI-crawler user-agents. This static tag is what a no-JS fetch of
      the entry document sees; the SPA keeps it on public routes and swaps in
      `noindex, nofollow` on private routes (src/lib/seo.js). These are all
      VOLUNTARY-compliance signals — see docs/PERIMETER_RUNBOOK.md for limits. -->
    <meta name="robots" content="noai, noimageai" />

    <!--
      Self-hosted fonts. The @font-face declarations live in src/index.css and
      are served from /public/fonts (Vite serves public/ at the web root). We no
      longer render-block on the Google Fonts CDN — the earlier stylesheet link
      forced a blocking stylesheet plus a second CDN round-trip on every
      landing, and left the family bytes on a third-party origin (a privacy +
      reliability liability). The same TTFs the PDF path already ships (Lora +
      Nunito) now dress the web UI too.

      Preload the two faces the first paint actually needs so the browser
      fetches them in parallel with the CSS rather than discovering them after
      it parses @font-face. WOFF2 (brotli) — ~65% smaller than the source TTF,
      so the critical-path font bytes drop from ~258 KB to ~88 KB:
        · Nunito-Regular  — the app body font (body { font-family: 'Nunito' }).
        · Lora-Bold       — the display/heading serif (largest above-the-fold
                            text; the token asks for it via the 'Crimson Text'
                            alias — see the @font-face comment in index.css).
      The preloaded format MUST match the @font-face src the browser resolves
      (both WOFF2) or the preload is wasted and the face is fetched again.
      Fonts are always fetched in CORS mode, so `crossorigin` is required on the
      preload even though these are same-origin, or the preload is discarded and
      re-fetched.
    -->
    <link rel="preload" href="/fonts/Nunito-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Lora-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- ── THE HOUSE DEVICE favicon set (owner-approved mark, 2026-07-18) ──────
      favicon.svg carries an embedded prefers-color-scheme swap (warm-black ink on
      light tabs, parchment-pale on dark; the seal-point shifts to the dim-field
      rubric). Safari ignores SVG favicons AND media attributes on icon links, so
      it takes favicon.ico (PNG-in-ICO 16+32, light ink); the media-queried dark
      PNG serves Chromium/Firefox dark tabs. The apple-touch icon is full-bleed
      parchment with the device inside the central-80% maskable safe zone. All
      static files under public/ — zero eager bytes. Regenerate:
      node scripts/gen-organic-logo.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Social / unfurl metadata (Open Graph + Twitter) ────────────────────
      These STATIC tags give the landing page a rich unfurl in Slack, iMessage,
      Discord, Twitter/X, Facebook, etc. Before this the card rendered blank.

      Scope note: this is the LANDING unfurl only. Per-gallery-page dynamic OG
      (a shared dossier link showing its own settlement name + painting) needs a
      prerender / SSR meta layer because the app is a client-rendered SPA and
      scrapers do not run JS. That is a Phase 5+ follow-up, out of scope here.

      og:image must be a fully-qualified absolute URL — Slack/Twitter/Facebook
      scrapers reject root-relative image paths. It points at an existing
      painting already shipped in public/backgrounds/. -->
    <meta name="description" content="Most generators roll on a table. This one simulates. First settlement or hundredth: the pieces explain each other." />
    <meta property="og:site_name" content="SettlementForge" />
    <meta property="og:title" content="SettlementForge — Forge a settlement worth running a campaign in." />
    <meta property="og:description" content="Most generators roll on a table. This one simulates. First settlement or hundredth: the pieces explain each other." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://settlementforge.com/" />
    <meta property="og:image" content="https://settlementforge.com/og-craft.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SettlementForge — Forge a settlement worth running a campaign in." />
    <meta name="twitter:description" content="Most generators roll on a table. This one simulates. First settlement or hundredth: the pieces explain each other." />
    <meta name="twitter:image" content="https://settlementforge.com/og-craft.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
