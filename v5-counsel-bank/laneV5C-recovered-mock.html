<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V5 war-arrow header mockup</title>
<style>
  /* ============ estate tokens (exact hexes from theme.js / tokens.js) ============ */
  :root {
    --shaft-sheen: #9C5A38; --shaft: #83492C; --shaft-body: #7A422A;
    --shaft-edge: #5E3220; --shaft-rim: #3F2013;
    --fletch-lead: #453D31; --fletch-vane: #332C22; --fletch-tip: #211C15;
    --fletch-barb: #312A20; --fletch-sheen: #4E4537; --fletch-sheen-lift: #5A5040;
    --fletch-rachis: #5A5040;
    --wrap: #521F12; --wrap-gloss: #7E3A24; --wrap-edge: #2E0F08;
    --gilt: #D4AF45; --gilt-light: #E6CB6F; --keyline: #241B0C;
    --bole: #3A1A10; --bole-deep: #2A1008;
    --seal-wax: #6E1F1B; --seal-rim: #4A1310; --seal-glint: #8E322B;
    --parch: #FBF5E6; --parch-100: #F4EAD0; --parch-200: #E8D9B0;
    --ink: #2A2118; --body: #4A4237; --card: #FFFBF5;
    --serif: Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    --sans: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--parch); }
  body { font-family: var(--sans); color: var(--body); }

  /* ============ the header: 38px sticky bar, all hang is paint ============ */
  .bar {
    position: sticky; top: 0; height: 38px; z-index: 40;
    background-color: var(--shaft);
    background-image:
      var(--grain-uri),
      linear-gradient(180deg, var(--shaft-sheen) 0%, var(--shaft-sheen) 9%,
        var(--shaft) 38%, var(--shaft-body) 95%, var(--shaft-edge) 98%, var(--shaft-rim) 100%);
  }
  .bar-inner { position: relative; height: 38px; display: flex; align-items: center; }

  /* the fletch cluster: three lanes of 88px, band SVG painted behind, hang past the bar */
  .cluster { position: relative; display: flex; align-self: stretch; margin-left: 400px; }
  .cluster svg.band { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .lane {
    position: relative; z-index: 2; width: 96px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; cursor: pointer; font-family: var(--sans);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
    color: var(--parch-100); padding: 8px 0;
  }
  .lane[aria-current="page"] { color: var(--parch); }

  /* reference tabs: burned into the wood (ash-fill brand construction) */
  .refs { display: flex; gap: 30px; margin-left: 96px; align-items: center; }
  .burned {
    background: transparent; border: 0; cursor: pointer; padding: 4px 2px;
    font-family: var(--serif); font-size: 12.5px; letter-spacing: 0.13em; text-transform: uppercase;
    font-weight: 700;
    color: var(--parch-100);
    -webkit-text-stroke: 0.5px rgba(42,16,8,0.85);
    text-shadow:
      0 0 1.5px rgba(42,16,8,0.9),
      1px 1px 2.5px rgba(42,16,8,0.55),
      -2px 0 4px rgba(42,16,8,0.28), 2px 1px 5px rgba(42,16,8,0.30);
  }
  .burned .g { display: inline-block; }

  .signin {
    margin-left: auto; margin-right: 30px;
    background: linear-gradient(180deg, var(--gilt-light), var(--gilt));
    color: var(--keyline); font-weight: 700; font-size: 12px; letter-spacing: 0.1em;
    padding: 6px 14px; border: 0; border-radius: 3px; cursor: pointer;
    box-shadow: 0 0 1.5px rgba(42,16,8,0.55), 1.5px 1.5px 3px rgba(42,16,8,0.5);
  }

  /* ============ the cartouche band (wraps the half-barrel) ============ */
  .cartouche { position: absolute; left: 30px; top: 0; height: 38px; width: 342px; }
  .cartouche svg { position: absolute; inset: 0; overflow: visible; }
  .word {
    position: absolute; left: 34px; top: 0; height: 38px;
    font-family: var(--serif); font-weight: 700; font-size: 24px; letter-spacing: 0.01em;
    line-height: 36px;
    white-space: nowrap;
  }
  .word .g {
    display: inline-block;
    background-image: linear-gradient(180deg, var(--gilt-light) 0%, var(--gilt) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: var(--gilt); -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 0.6px var(--keyline);
    text-shadow: -0.4px -0.4px 0 rgba(230,203,111,0.55);
  }
  .word .cap { font-size: 1.32em; }

  /* ============ the nock (tail) at the right edge ============ */
  .nock { position: absolute; right: 0; top: 0; bottom: 0; width: 16px; }

  /* ============ page content ============ */
  .page { max-width: 1060px; margin: 0 auto; padding: 64px 32px 120px; }
  .hero h1 { font-family: var(--serif); color: var(--ink); font-size: 40px; margin: 18px 0 10px; }
  .hero p { font-size: 16px; max-width: 620px; line-height: 1.55; margin: 0 0 26px; }
  .cta { display: inline-block; background: linear-gradient(180deg, var(--gilt-light), var(--gilt));
         color: var(--keyline); font-weight: 700; padding: 11px 22px; border-radius: 4px;
         border: 1px solid #B8933C; text-decoration: none; }
  .cards { display: flex; gap: 20px; margin-top: 44px; }
  .card { flex: 1; background: var(--card); border: 1px solid var(--parch-200); border-radius: 6px; padding: 20px; }
  .card h3 { font-family: var(--serif); color: var(--ink); margin: 0 0 8px; font-size: 19px; }
  .card p { font-size: 13.5px; line-height: 1.5; margin: 0; }
  .strip { margin-top: 46px; background: var(--card); border: 1px solid var(--parch-200); border-radius: 6px; }
  .strip .row { display: flex; justify-content: space-between; padding: 11px 18px; border-top: 1px solid var(--parch-200); font-size: 13px; }
  .strip .row:first-child { border-top: 0; font-weight: 600; color: var(--ink); }

  /* ============ closeup view ============ */
  .panelwrap { padding: 40px; display: flex; flex-direction: column; gap: 26px; background: var(--parch); }
  .panelrow { display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: var(--card); border: 1px solid var(--parch-200); border-radius: 6px; padding: 14px; }
  .panel .cap-label { font: 11px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--body); margin-top: 10px; }
  .swatchbar { position: relative; height: 38px; width: 400px;
    background-color: var(--shaft);
    background-image:
      var(--grain-uri),
      linear-gradient(180deg, var(--shaft-sheen) 0%, var(--shaft-sheen) 9%,
        var(--shaft) 38%, var(--shaft-body) 95%, var(--shaft-edge) 98%, var(--shaft-rim) 100%); }
  .z2 { transform: scale(2); transform-origin: top left; }
  .z2wrap { overflow: visible; }
</style>
</head>
<body>
<script>
/* deterministic hash — copied in spirit from FletchBand.unitHash (integer arithmetic only) */
function unitHash(n) {
  let h = Math.imul(n | 0, 2654435761) >>> 0;
  h = ((h ^ (h >>> 15)) >>> 0);
  h = Math.imul(h, 2246822519) >>> 0;
  h = ((h ^ (h >>> 13)) >>> 0);
  return (h % 4096) / 4095;
}
/* grain tile: seed-7-flavored anisotropic turbulence, EDGE tone, darkening-only */
const GRAIN = "url(\"data:image/svg+xml," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='64'>" +
  "<filter id='g' filterUnits='userSpaceOnUse' x='0' y='0' width='320' height='64' color-interpolation-filters='sRGB'>" +
  "<feTurbulence type='fractalNoise' baseFrequency='0.008 0.42' numOctaves='3' seed='7' stitchTiles='stitch'/>" +
  "<feColorMatrix type='matrix' values='0 0 0 0 0.368 0 0 0 0 0.196 0 0 0 0 0.125 0.128 0.128 0.128 0 -0.141'/>" +
  "</filter><rect width='320' height='64' filter='url(#g)'/></svg>") + "\")";
document.documentElement.style.setProperty('--grain-uri', GRAIN);
</script>

<div id="root"></div>

<script>
/* ================= geometry: the organic fletch band (REST state) =================
   Coordinate space: x 0..288 (three 96px lanes at 1440), y in bar px (bar = 38).
   Each vane: a QUILL (bound along the shaft, sagging ~2px) + a WEB drooping from it.
   The web's tail sweeps back up to kiss the quill's aft end (its own attachment).
   Z ascends into Realm; laps encode Create feeds Library feeds Realm.            */

const SCROLL_U = { rest: 1, scrolled: 0.42 };   /* belly factor about the quill pivot */
const PIVOT = 4.2;                               /* the quill line's mean depth */

/* squash y about the quill pivot for the scrolled state */
const sq = (u) => (y) => PIVOT + (y - PIVOT) * u;

function vanePaths(u) {
  const s = sq(u);
  /* per-vane authored geometry: quill A->B, web outline. Non-uniform on purpose. */
  const vanes = [
    { /* Create — carries the leading cut of the whole cluster */
      quill: `M 8 3.6 C 40 ${s(6.0)}, 84 ${s(5.6)}, 116 4.6`,
      web: `M 15 4.4
            L 3.5 ${s(24)}
            C 5 ${s(35)}, 10 ${s(43)}, 20 ${s(49)}
            C 33 ${s(56.5)}, 46 ${s(60.5)}, 56 ${s(61.5)}
            L 58.5 ${s(51)} L 65 ${s(60.8)}
            C 80 ${s(58.5)}, 92 ${s(46)}, 99 ${s(32)}
            C 105 ${s(20)}, 111 ${s(9)}, 116 4.6
            C 84 ${s(6.4)}, 40 ${s(6.8)}, 15 4.4 Z`,
      tieA: { x: 8, y: 3.6 }, tieB: { x: 116, y: 4.6 },
      belly: 61.5, cut: [15, 3.5]
    },
    { /* Library — its leading cut laps OVER Create's rising tail */
      quill: `M 102 3.2 C 136 ${s(5.6)}, 180 ${s(5.2)}, 220 4.4`,
      web: `M 109 4.1
            L 95.5 ${s(26)}
            C 98 ${s(38)}, 104 ${s(47)}, 115 ${s(54)}
            C 130 ${s(63)}, 148 ${s(69)}, 160 ${s(70)}
            L 163 ${s(58.5)} L 170 ${s(69.4)}
            C 186 ${s(66.5)}, 198 ${s(52)}, 206 ${s(36)}
            C 212 ${s(22)}, 216 ${s(10)}, 220 4.4
            C 180 ${s(6.0)}, 136 ${s(6.4)}, 109 4.1 Z`,
      tieA: { x: 102, y: 3.2 }, tieB: { x: 220, y: 4.4 },
      belly: 70, cut: [109, 3.2]
    },
    { /* Realm — deepest; its quill runs on under the trail wrap (no tail tie) */
      quill: `M 206 3.6 C 240 ${s(6.2)}, 272 ${s(6.0)}, 298 5.0`,
      web: `M 213 4.2
            L 199.5 ${s(28)}
            C 202 ${s(41)}, 209 ${s(51)}, 221 ${s(59)}
            C 236 ${s(69)}, 252 ${s(75.5)}, 263 ${s(76)}
            L 265.5 ${s(63.5)} L 272 ${s(75.2)}
            C 284 ${s(70)}, 291 ${s(52)}, 295 ${s(36)}
            C 297.5 ${s(22)}, 298 ${s(10)}, 298 5.0
            C 272 ${s(6.8)}, 240 ${s(7.0)}, 213 4.2 Z`,
      tieA: { x: 206, y: 3.6 }, tieB: null,
      belly: 76, cut: [213, 3.4]
    },
  ];
  return vanes;
}

/* two broad darkening-only bars per vane, leaning at the barb angle */
function barPolys(u) {
  const s = sq(u);
  const mk = (x, w, y0, y1, lean) =>
    `M ${x} ${s(y0)} L ${x + w} ${s(y0)} L ${x + w - lean} ${s(y1)} L ${x - lean} ${s(y1)} Z`;
  return [
    [mk(26, 12, 8, 56, 14), mk(64, 10, 8, 50, 12)],
    [mk(124, 13, 8, 62, 15), mk(168, 11, 8, 64, 13)],
    [mk(230, 13, 8, 68, 15), mk(272, 10, 8, 58, 12)],
  ];
}

/* whisper comb: a few sub-pixel barb strokes per vane */
function combPaths(u) {
  const s = sq(u);
  const out = [[], [], []];
  const spans = [[10, 112], [104, 216], [208, 296]];
  spans.forEach(([a, b], lane) => {
    let x = a;
    for (let k = 0; x < b; k += 1) {
      const drop = 30 + unitHash(k * 7 + lane * 131) * 26;
      out[lane].push(`M ${x.toFixed(1)} ${s(7)} Q ${(x - 3.4).toFixed(1)} ${s(7 + drop * 0.62)} ${(x - 11).toFixed(1)} ${s(7 + drop)}`);
      x += 5.6 * (0.9 + 0.2 * unitHash(k + lane * 911));
    }
  });
  return out;
}

/* free barb tips escaping the belly cut */
function frayPaths(u) {
  const s = sq(u);
  const specs = [[20, 96, 61.5], [118, 200, 70], [224, 290, 76]];
  return specs.map(([a, b, d], lane) => {
    const out = [];
    let x = a;
    for (let k = 0; x < b; k += 1) {
      const uu = unitHash(k * 37 + lane * 613 + 11);
      const drop = 1.2 + uu * 2.6;
      const yb = d - (Math.abs((x - (a + b) / 2)) / ((b - a) / 2)) * d * 0.28;
      out.push(`M ${x.toFixed(1)} ${s(yb)} l ${-drop * 0.42} ${((s(yb + drop) - s(yb))).toFixed(2)}`);
      x += 6.4 * (1.1 + uu * 0.9);
    }
    return out.join(' ');
  });
}

/* one mini-lashing: 3 thread turns crossing the quill at a kiss point */
function lashing(x, y, seed) {
  const j = (unitHash(seed) - 0.5) * 1.6;
  const t = [];
  for (let i = 0; i < 3; i += 1) {
    const xx = x + i * 2.1 - 2.1 + j * 0.4;
    t.push(`M ${xx} ${(y - 3.4).toFixed(1)} L ${(xx - 1.3).toFixed(1)} ${(y + 3.8).toFixed(1)}`);
  }
  return t.join(' ');
}

function bandSVG(u, active) {
  const vanes = vanePaths(u);
  const bars = barPolys(u);
  const combs = combPaths(u);
  const frays = frayPaths(u);
  const grad = (id, a, b, cTop, cMid, cTip) => `
    <linearGradient id="${id}" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="${cTop}"/>
      <stop offset="0.42" stop-color="${cMid}"/>
      <stop offset="0.74" stop-color="${cMid}"/>
      <stop offset="1" stop-color="${cTip}"/>
    </linearGradient>`;
  let defs = `
    ${grad('v-rest', 0, 0, 'var(--fletch-lead)', 'var(--fletch-vane)', 'var(--fletch-tip)')}
    ${grad('v-lit', 0, 0, 'var(--fletch-sheen)', 'var(--fletch-lead)', 'var(--fletch-vane)')}
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="ao" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#2A251E" flood-opacity="0.62"/>
    </filter>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="3.9" dy="3.9" stdDeviation="4.6" flood-color="#2A251E" flood-opacity="0.42"/>
    </filter>`;
  let body = '';
  vanes.forEach((v, lane) => {
    const lit = lane === active;
    body += `<g filter="url(#ao)">`
      + `<g filter="url(#cast)">`
      + `<path d="${v.web}" fill="url(#${lit ? 'v-lit' : 'v-rest'})"/>`
      + `</g>`
      /* sheen bands, soft */
      + `<g filter="url(#soft)" opacity="0.85">`
      + `<path d="${bars[lane][0]}" fill="${lit ? 'var(--fletch-sheen-lift)' : 'var(--fletch-sheen)'}" opacity="0.5"/>`
      + `</g>`
      /* barring rhythm: darkening-only */
      + `<g filter="url(#soft)">`
      + `<path d="${bars[lane][1]}" fill="var(--fletch-tip)" opacity="0.5"/>`
      + `</g>`
      /* whisper comb */
      + `<g opacity="0.5">`
      + combs[lane].map((d) => `<path d="${d}" fill="none" stroke="var(--fletch-barb)" stroke-width="0.4" stroke-opacity="0.35" vector-effect="non-scaling-stroke"/>`).join('')
      + `</g>`
      /* the quill: pale rachis bound along the shaft, lit edge above */
      + `<path d="${v.quill}" fill="none" stroke="var(--fletch-rachis)" stroke-width="1.5" stroke-opacity="0.9" vector-effect="non-scaling-stroke"/>`
      + `<path d="${v.quill}" fill="none" stroke="#6A5F4E" stroke-width="0.5" stroke-opacity="0.6" vector-effect="non-scaling-stroke" transform="translate(-0.35,-0.35)"/>`
      /* fray */
      + `<path d="${frays[lane]}" fill="none" stroke="var(--fletch-barb)" stroke-opacity="0.32" stroke-width="0.42" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
      + `</g>`;
    /* the quill-line indicator: gilt ribbon along the ACTIVE vane's quill */
    if (lit) {
      body += `<path d="${v.quill}" fill="none" stroke="var(--gilt-light)" stroke-width="2.4" stroke-opacity="0.97" vector-effect="non-scaling-stroke"/>`;
    }
    /* thread lashings at the kiss points (over the vane's own paint) */
    body += `<g stroke="var(--wrap)" stroke-width="1.25" stroke-opacity="0.95" vector-effect="non-scaling-stroke">`
      + `<path d="${lashing(v.tieA.x, v.tieA.y, 211 + lane)}"/>`
      + (v.tieB ? `<path d="${lashing(v.tieB.x, v.tieB.y, 307 + lane)}"/>` : '')
      + `</g>`
      + `<g stroke="var(--wrap-gloss)" stroke-width="0.45" stroke-opacity="0.8" vector-effect="non-scaling-stroke">`
      + `<path d="${lashing(v.tieA.x - 0.4, v.tieA.y - 0.3, 211 + lane)}"/>`
      + (v.tieB ? `<path d="${lashing(v.tieB.x - 0.4, v.tieB.y - 0.3, 307 + lane)}"/>` : '')
      + `</g>`;
  });
  return `<svg class="band" viewBox="0 0 288 38" preserveAspectRatio="none" aria-hidden="true">
    <defs>${defs}</defs>${body}</svg>`;
}

/* ============ one cluster wrap (dense turns + tie-off), as inline SVG ============ */
function wrapSVG(side) {
  const W = 10, H = 38;
  const turns = [];
  for (let x = 0; x < W; x += 2.6) {
    turns.push(`<rect x="${x}" y="0" width="0.4" height="${H}" fill="var(--wrap-edge)"/>`);
    turns.push(`<rect x="${(x + 0.4).toFixed(1)}" y="0" width="1.0" height="${H}" fill="var(--wrap-gloss)"/>`);
    turns.push(`<rect x="${(x + 1.4).toFixed(1)}" y="0" width="1.2" height="${H}" fill="var(--wrap)"/>`);
  }
  const seat = side === 'lead' ? H * 0.62 : H * 0.16;
  const jit = (unitHash(side === 'lead' ? 811 : 929) - 0.5) * 4;
  const y0 = seat + jit, y1 = y0 + 20.5;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;top:0;${side === 'lead' ? 'left:-16px' : 'right:-14px'};overflow:hidden" aria-hidden="true">
    ${turns.join('')}
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#wrapbarrel)"/>
    <path d="M ${W + 2} ${y0} L -2 ${y1}" stroke="var(--wrap-edge)" stroke-width="3.4" fill="none"/>
    <path d="M ${W + 2} ${y0} L -2 ${y1}" stroke="var(--wrap-gloss)" stroke-width="2.6" stroke-opacity="0.5" fill="none"/>
  </svg>`;
}

/* ============ the cartouche band ============ */
function cartoucheSVG() {
  /* band silhouette: cusped ogee ends + finials; top bleeds off the viewport cut;
     bottom dissolves into the rim. Hand-authored wobble on the burned edge. */
  const field = `M 8 19
    C 10 14, 16 11, 22 9.5 C 26 8.3, 30 6.5, 33 3.5 L 33 -3
    L 309 -3 L 309 3.5 C 312 6.5, 316 8.3, 320 9.5 C 326 11, 332 14, 334 19
    C 332 24, 326 27, 320 28.5 C 316 29.7, 312 31.5, 309 34.5 L 309 38.6 L 33 38.6 L 33 34.5
    C 30 31.5, 26 29.7, 22 28.5 C 16 27, 10 24, 8 19 Z`;
  const innerline = `M 14.5 19 C 17 15.5, 22 13.2, 27 11.8 C 31 10.6, 35 8.4, 37.5 5.2
    L 304.5 5.2 C 307 8.4, 311 10.6, 315 11.8 C 320 13.2, 325 15.5, 327.5 19
    C 325 22.5, 320 24.8, 315 26.2 C 311 27.4, 307 29.6, 304.5 32.8 L 37.5 32.8
    C 35 29.6, 31 27.4, 27 26.2 C 22 24.8, 17 22.5, 14.5 19 Z`;
  return `<svg viewBox="0 0 342 38" aria-hidden="true">
    <defs>
      <filter id="singe" x="-20%" y="-40%" width="140%" height="200%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.16" numOctaves="3" seed="17" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="3 1.4"/>
      </filter>
      <filter id="scorch" x="-20%" y="-40%" width="140%" height="200%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.16" numOctaves="3" seed="17" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <path d="${field}" fill="var(--bole-deep)" fill-opacity="0.85" filter="url(#singe)" transform="translate(0,0) scale(1.012)" transform-origin="171 19"/>
    <path d="${field}" fill="var(--bole)" filter="url(#scorch)"/>
    <path d="${field}" fill="var(--bole)" transform="scale(0.985)" transform-origin="171 19"/>
    <path d="${innerline}" fill="none" stroke="var(--gilt)" stroke-width="1.1" stroke-opacity="0.9"/>
    <path d="${innerline}" fill="none" stroke="var(--gilt-light)" stroke-width="0.4" stroke-opacity="0.6" transform="translate(-0.3,-0.3)"/>
  </svg>`;
}

/* the seal: WaxSeal geometry verbatim (BLOB / COUNTER), triangle-register impression */
function sealSVG(px, register) {
  const BLOB = 'M 50 4 C 74 4, 96 22, 96 48 C 96 74, 76 97, 49 97 C 24 97, 3 76, 4 50 C 5 25, 26 4, 50 4 Z';
  const COUNTER = 'M 50 26 C 63 26, 73 37, 73 50 C 73 63, 63 74, 50 74 C 37 74, 27 63, 27 50 C 27 37, 37 26, 50 26 Z';
  const RING = 0.14, S = 100;
  const t = (S / 2) * RING, k = 1 - RING;
  const inner = COUNTER.replace(/-?\d+(?:\.\d+)?/g, (n) => String(Number(((Number(n) - t) / k).toFixed(3))));
  const TRI = 'M 31.9 15.2 L 41.05 30.9 Q 32 31.35 23.05 31.1 Z';
  const DOT = `<circle cx="32" cy="25.7" r="4.2"/>`;
  const dev = register === 'device'
    ? `<g transform="translate(29.5 28.5) scale(0.6406)">
         <g transform="translate(-1.13,-1.13)" fill="none" stroke="var(--seal-glint)" stroke-opacity="0.5" stroke-linejoin="round" stroke-linecap="round">
           <path d="M 7 44 A 27.15 26.85 0 1 1 57 44" stroke-width="4.27"/>
           <path d="${TRI}" stroke-width="3.47"/><g fill="var(--seal-glint)" fill-opacity="0.5" stroke="none">${DOT}</g>
         </g>
         <g transform="translate(1.13,1.13)" fill="none" stroke="var(--seal-rim)" stroke-opacity="0.9" stroke-linejoin="round" stroke-linecap="round">
           <path d="M 7 44 A 27.15 26.85 0 1 1 57 44" stroke-width="6.1"/>
           <path d="${TRI}" stroke-width="4.95"/><g fill="var(--seal-rim)" fill-opacity="0.9" stroke="none">${DOT}</g>
         </g>
       </g>`
    : register === 'triangle'
      ? `<g transform="translate(29.5 28.5) scale(0.6406)">
           <g transform="translate(-1.4,-1.4)"><path d="${TRI}" fill="none" stroke="var(--seal-glint)" stroke-opacity="0.55" stroke-width="5.2" stroke-linejoin="round"/></g>
           <g transform="translate(1.4,1.4)"><path d="${TRI}" fill="none" stroke="var(--seal-rim)" stroke-opacity="0.92" stroke-width="6.4" stroke-linejoin="round"/></g>
         </g>`
      : '';
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" aria-hidden="true"
      style="display:inline-block; vertical-align: -0.26em; margin: 0 -0.08em; overflow: visible;">
    <path d="${BLOB} ${COUNTER}" fill-rule="evenodd" fill="var(--gilt)"/>
    <g transform="translate(${t} ${t}) scale(${k})"><path d="${BLOB} ${inner}" fill-rule="evenodd" fill="var(--seal-wax)"/></g>
    <path d="${COUNTER}" fill="none" stroke="var(--seal-rim)" stroke-width="5"/>
    ${dev}
    <path d="M 21.87 21.87 Q 15.0 50.0 21.87 78.13" fill="none" stroke="var(--seal-glint)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75" transform="rotate(-45 50 50)"/>
    <path d="${BLOB}" fill="none" stroke="var(--gilt-light)" stroke-width="2" stroke-opacity="0.55"/>
  </svg>`;
}

/* warped lettering: per-glyph inline-block transforms — bow + tangent rotate + foreshorten.
   sagPx: baseline bow at center; foreshorten: scaleY at max; maxRot: tangent at the ends. */
function warpWord(word, { sagPx, foreshorten, maxRotDeg, capEm, sealPx, sealRegister, flat }) {
  const glyphs = [];
  const chars = word.split('');
  const n = chars.length - 1;
  chars.forEach((ch, i) => {
    const t = (i / n) * 2 - 1;                    /* -1 .. 1 across the run */
    const bow = flat ? 0 : sagPx * (1 - t * t);
    const rot = flat ? 0 : -maxRotDeg * t;
    const sy = flat ? 1 : (1 - (1 - foreshorten) * (0.55 + 0.45 * (1 - t * t)));
    const cap = (ch === 'S' || ch === 'F') ? ' cap' : '';
    if (ch === 'o' && i === 11 && sealPx) {       /* the o of Forge */
      glyphs.push(`<span class="g seal-slot" style="transform: translateY(${bow.toFixed(2)}px)">${sealSVG(sealPx, sealRegister)}</span>`);
      return;
    }
    glyphs.push(`<span class="g${cap}" style="transform: translateY(${bow.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scaleY(${sy.toFixed(3)}); transform-origin: 50% 18%;">${ch}</span>`);
  });
  return glyphs.join('');
}

/* burned tab label with subtle warp */
function warpTab(word, { flat } = {}) {
  const chars = word.split('');
  const n = chars.length - 1;
  return chars.map((ch, i) => {
    const t = (i / n) * 2 - 1;
    const bow = flat ? 0 : 1.0 * (1 - t * t);
    const rot = flat ? 0 : -0.8 * t;
    const sy = flat ? 1 : 0.96 + 0.02 * (1 - t * t);
    return `<span class="g" style="transform: translateY(${bow.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scaleY(${sy.toFixed(3)}); transform-origin: 50% 15%;">${ch}</span>`;
  }).join('');
}
