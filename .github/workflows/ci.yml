name: CI

on:
  # Run on every branch push (not just master/main) so feature branches — where
  # the work actually happens — get the same gate before they ever reach a PR
  # (finding F35: CI was advisory to feature branches).
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]
  # Manual trigger + weekly cron drive the opt-in mutation-sweep job below (it is
  # gated to these events only). Per-push/PR runs are unaffected — the sweep runs
  # a gate step once per injected mutation and is too slow for the hot path.
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

jobs:
  check:
    name: Validate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A+ P0.4: fail the gate on a HIGH+ vulnerability in a PRODUCTION dependency
      # (e.g. the dompurify advisory behind the gallery XSS floor). Dev-only
      # advisories (esbuild/vite dev server) are excluded via --omit=dev and tracked
      # separately — they require a breaking major bump.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      # Fail fast on data corruption: duplicate object keys silently
      # overwrite earlier definitions in JS, so a regression here would
      # quietly distort the simulation outputs without breaking the build.
      - name: Validate data
        run: npm run validate:data

      # Migration-chain ledger: contiguity + the applied-head marker
      # (supabase/applied-head.json). Catches double-booked or gapped
      # migration numbers at CI time; the pending-deploy window is
      # visible-not-fatal, matching the manual `supabase db push` flow.
      - name: Validate migration head
        run: npm run validate:migration-head

      - name: Validate edge functions
        run: npm run validate:edge

      - name: Validate vendored map JavaScript
        run: npm run validate:map

      # tsc --noEmit against src/domain/. The JSDoc types in the domain
      # layer get validated by tsc; the pipeline output object shapes,
      # impairment dimensions, event types, and faction-response shapes
      # are all enforced at edit time. Adding a new event without
      # updating EventType union fails here.
      - name: Type check
        run: npm run typecheck

      # The domain strict-typecheck RATCHET (scripts/check-domain-strict.mjs):
      # a monotone-shrink baseline of strict-mode errors in the domain kernel.
      # It is wired into `npm run check` but CI previously omitted it, so a
      # strict regression could ship green and was caught only by the
      # bypassable pre-push hook (finding F35 / maintainability). Now enforced
      # in CI so the local gate and CI can't diverge.
      - name: Domain strict-type ratchet
        run: npm run typecheck:domain:strict

      # ESLint on the full src/ + tests + scripts. Correctness rules
      # (undefined vars, dupe keys, rules-of-hooks, the design-token and
      # analytics-event contracts) are errors; forward-looking React 19
      # rules and unused-vars are warnings, surfaced for drift tracking
      # without blocking. The tree currently lints clean (0 problems).
      # Promote the React 19 warnings to errors when adopting React Compiler.
      - name: Lint
        run: npm run lint

      # Vitest: unit + property-based (fast-check) engine tests, domain +
      # store + lib integration, component/UI smoke, a11y, security, and
      # edge-function contract tests. ~2,600 tests across ~170 files.
      - name: Run tests
        run: npm run test

      # Production build — confirms Vite/Rollup chunking is healthy, the
      # bundle still produces, and (via the vite.config onwarn guard) that
      # no named import is missing/unresolved. NOTE: Vercel currently
      # deploys on push to master independently of this workflow — see
      # docs/DEPLOY.md ("Gating production on CI") to make this check a
      # required gate before a production deploy.
      - name: Build
        run: npm run build

  e2e:
    name: Chromium end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E
        run: npx playwright test --project=chromium

      - name: Audit mobile pointer targets
        run: npx playwright test e2e/mobile-pointer-targets.spec.js --project=mobile-safari

  # Execution tests for the Supabase edge functions (Deno runtime, not vitest).
  # The money-path trust boundaries (stripe-webhook signature verification; later
  # the generate-narrative refund decision) are RUN here against forged vs. signed
  # requests — the regex-over-source contracts in vitest can't prove behavior.
  coverage-floors:
    # Coverage floors for the money / security modules — a regression RATCHET
    # on the highest-consequence files (spend/refund via aiSlice+creditsSlice,
    # saves, checkout reconcile, credit ledger, stripe, pending dossier). Runs
    # the suite under v8 coverage and fails if any floored file drops more than
    # ~5pts below its measured baseline (floors in vite.config.js
    # coverage.thresholds; a deleted money-path test is exactly the regression
    # this catches). Parallel to `check` so the ratchet never doubles the
    # critical path's wall-clock.
    name: Coverage floors (money / security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Coverage floors
        run: npm run test:coverage:floors

  deno-tests:
    name: Edge function execution tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run edge-function Deno tests
        run: deno task test:edge

  # ── Golden master under a hostile locale + timezone ──────────────────────────
  # The `check` job runs the suite in CI's default C.UTF-8/UTC environment — the
  # same class of environment the golden manifest was captured in, so a locale-
  # dependent formatting or collation leak (toLocaleString rendering `8000` as
  # "8.000", ICU collation reordering a sort) can sit green there forever and
  # still break same-seed replay on a user's machine. This leg re-runs ONLY the
  # golden/determinism suites (cheap — seconds of test time, not the full gate)
  # under tr_TR.UTF-8 (the Turkish-I locale that breaks the most latent i18n
  # assumptions; Node's ICU reads LANG/LC_ALL directly, so no locale-gen setup
  # is needed) and a non-UTC, odd-offset timezone (Chatham, +12:45/+13:45). If
  # any hash in the 155-config manifest depends on the host locale or clock,
  # this job reds while `check` stays green — the exact leak the eslint
  # locale-formatting ban and tests/lint/localeFormatGuard.test.js guard at
  # edit time, proven end-to-end here.
  determinism-hostile-locale:
    name: Golden master under tr_TR + Chatham TZ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
      TZ: Pacific/Chatham
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Golden + determinism suites (hostile locale/TZ)
        run: >
          npx vitest run
          tests/property/generatorGoldenMaster.test.js
          tests/pdf/goldenViewModel.test.js
          tests/domain/determinismLeaks.test.js
          tests/generators/customContentDeterminism.test.js
          tests/domain/formatNumber.test.js
          tests/kernel/rngContextFailClosed.test.js
          tests/lint/localeFormatGuard.test.js
          tests/lint/localeCompareGuard.test.js

  # ── Enforcement-spine mutation sweep (opt-in) ───────────────────────────────
  # Injects a deliberate regression per enforced invariant and asserts the gate
  # catches each one (scripts/mutation-sweep.sh). It runs a gate step PER mutation
  # (slow), so it is kept OFF the per-push/PR hot path: only the weekly cron and a
  # manual workflow_dispatch trigger it. The fresh checkout is clean, so the
  # script's dirty-tree guard is a no-op here; a MISSED regression (a gate that
  # stayed green under a planted bug) exits nonzero and fails this job.
  mutation-sweep:
    name: Enforcement mutation sweep (weekly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation sweep
        run: bash scripts/mutation-sweep.sh

  # ── Production deploy gated on the full green gate (finding F35) ─────────────
  # "The gate is the product": production must advance only through CI. This job
  # runs ONLY after check + e2e + deno-tests pass, ONLY on master. It is a safe
  # no-op until the operator finishes the dashboard half — set the VERCEL_TOKEN
  # secret AND turn OFF Vercel's push auto-deploy (see docs/DEPLOY.md). Until
  # then it logs and skips (green), so adding it can't break the current flow;
  # once configured, CI becomes the ONLY path to production.
  deploy:
    name: Deploy to production (gated)
    needs: [check, e2e, deno-tests, coverage-floors, determinism-hostile-locale]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve deploy readiness
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN not set — skipping CI deploy. Vercel push auto-deploy (if still enabled) handles production. See docs/DEPLOY.md to make CI the only path."
          fi
      - name: Deploy to Vercel (production)
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
