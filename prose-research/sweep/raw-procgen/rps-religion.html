<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="We couldn’t find the page you were looking for.">

  <title>404 Page not found</title>

  <style>
    :root {
      --background: white;
      --base: #303030;
      --title: black;
      --link: black;
      --muted: #656565;
      --border: #dadada;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin: 0;
      padding: 2rem;
      font-family: sans-serif;
      font-size: 18px;
      color: var(--base);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
      line-height: 1;
    }

    a {
      color: var(--link);
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 0 0 1rem;

      a {
        font-weight: bold;
      }
    }

    main {
      padding: 4rem 0;

      h1 {
        color: var(--title);
        line-height: 1;
        margin: 0 0 1rem;
      }

      p {
        margin: 1rem 0;
      }

      .button {
        display: inline-block;
        border: 1px solid var(--border);
        color: var(--title);
        text-decoration: underline;
        font-weight: bold;
        border-radius: 1.5em;
        padding: .5em 1.5em;
        margin: 1rem 0 0;
      }
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 0 0;
      color: var(--muted);

      p {
        margin: 0;
        padding: 0;

        strong {
          color: var(--title);
        }
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="https://assets.gnwcdn.com/0275_rockpapershotgun-logo.svg" width=208 alt="Rock Paper Shotgun"></a>
  </header>

  <main>
    <h1>404 Page not found</h1>

    <p>We couldn’t find the page you were looking for.</p>

      <p>Maybe it's been removed, or maybe it never existed in the first place (a bit like Half-Life 3).</p>

    <p>If you followed a link to this page from our site, <a href="/contact-us?enquiry_type=editorial&amp;subject=404+error">let us know</a> so we can fix it.</p>

    <a href="/" class="button">&larr; Back to Rock Paper Shotgun</a>
  </main>

  <footer>
    <p>HTTP status: <strong>404</strong>.</p>
  </footer>
</body>
</html>
