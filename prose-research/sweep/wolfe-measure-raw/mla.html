        <h1 id="pagetitle"><em>MLA International Bibliography</em></h1>
                    <div class="fieldtype-xmltext">
                <div class="ezrichtext-field"><p>The <em>MLA International Bibliography</em> is the essential research database for languages, literature, and related fields. Created by scholars for student and scholarly researchers, it is available on <em>EBSCOhost</em> and includes a full-text version. Find out more:</p><p><a href="/Publications/MLA-International-Bibliography/At-a-Glance">At a Glance</a></p><p><a href="/Publications/MLA-International-Bibliography/Subscribe">Subscribe</a></p><p><a href="/Publications/MLA-International-Bibliography/Submit-Work">Submit Work</a>&nbsp;</p><p><a href="/Publications/MLA-International-Bibliography/Get-Teaching-Resources">Get Teaching Resources</a></p><p><a href="/Publications/MLA-International-Bibliography/Volunteer">Volunteer</a></p><p>Learn more about the <em>MLA International Bibliography</em>, AI, and the MLA&rsquo;s mission to support research.&nbsp;</p><p><div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/1159253580?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Angela Gibson on Research, AI, and the MLA&#039;s Global Mission"></iframe></div><script src="https://player.vimeo.com/api/player.js"></script></p>
<p><a href="/Publications/MLA-International-Bibliography/Transcript-for-Angela-Gibson-Video">View the&nbsp;transcript</a>.</p><p>Have a question? <a href="mailto:bibliography@mla.org" title="" class=" file-org">Contact</a> the staff of the <em>MLA International Bibliography</em>.&nbsp;</p>
</div>
