<!DOCTYPE html>
<html lang="en">
<head>
<style type="text/css">
	body {
		background-color: #f0f0f2;
		margin: 0;
		padding: 0;
		font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
		color: #444;
	}
	p {
		line-height: 1.5em;
	}
	div {
		width: 600px;
		margin: 5em auto;
		padding: 1em 3em;
		background-color: #fff;
		border-radius: 1em;
	}
	a:link, a:visited {
		color: #38488f;
	}
	h1 {
		margin-top: 0.5em;

	h2 {
		margin-top: 1.5em;

	}
	@media (max-width: 700px) {
		body {
			background-color: #fff;
		}
		div {
			width: auto;
			margin: 0 auto;
			border-radius: 0;
			padding: 1em;
		}
	}
</style>

<script>
	async function SHAHex(message)
	{
		const msgBuffer = new TextEncoder().encode(message);
		const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
		const hashArray = Array.from(new Uint8Array(hashBuffer));
		return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
	}

	async function RunProofOfWork(difficulty)
	{
		const challenge = "tigertech_session_challenge_token";
		const targetPrefix = '0'.repeat(difficulty);
		
		let timeStart = Date.now();
		
		let tries = 0;
		// Loop until a hash is found that starts with the required number of zeros
		for (; tries < 999999; tries++)
		{
			let hash = await SHAHex(challenge + tries);
			if (hash.startsWith(targetPrefix))
			{
				break;
			}
		}

		let timeEnd = Date.now();
		let timeTaken = timeEnd - timeStart;

		// console.log('Done in ' + timeTaken + 'ms (' + tries + ')');
		document.cookie = "tt_pow_b9TjTVPn=" + tries + '-' + timeTaken + "; path=/; max-age=86400";

		// Replace current page in history so back-button loops are avoided
		const url = new URL(window.location.href);
		url.searchParams.delete('tt_pow_b9TjTVPn');
		url.searchParams.append('tt_pow_b9TjTVPn', tries + '-' + timeTaken + '-' + timeEnd);
		window.location.replace(url.href);
	}

	// Run the proof of work immediately upon page load
	// window.addEventListener('DOMContentLoaded', RunProofOfWork(4));
</script>



	<title>412 Precondition Failed</title>
	</head>

	<body>
	<div>
	<h1>412 Precondition Failed</h1>

	<p>
	The request was not completed because it matched a "security rule". See

	details.
	</p>


	<h2>How can I fix this?</h2>
	
	</p>
	<a href="#" onClick="RunProofOfWork(3)">Click this link to try your request again</a>.
	</p>


	</div>


</body>
