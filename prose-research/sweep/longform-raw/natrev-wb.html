e&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/630655648a5d061f084d0f07\\\/video-RTS1PXJM.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;Biden \\u2018Forgives\\u2019 Massive Amount of Student-Loan Debt, Transferring Cost to Public&quot;}},{&quot;clickthrough&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/videos\\\/mcconnell-u-s-has-very-solid-democracy-there-is-very-little-election-fraud\\\/&quot;,&quot;poster&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/wp-content\\\/uploads\\\/2022\\\/11\\\/nrs.jpg&quot;,&quot;type&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/63052cdf537ee36c5205ff35\\\/mcconnell-u-s-has-very-solid-democracy-there-is-very-little-election-fraud-4.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;McConnell: U.S. Has \\u2018Very Solid Democracy,\\u2019 There Is \\u2018Very Little Election Fraud\\u2019&quot;}},{&quot;clickthrough&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/videos\\\/white-house-moving-toward-canceling-10k-in-student-debt-for-certain-borrowers\\\/&quot;,&quot;poster&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/wp-content\\\/uploads\\\/2022\\\/11\\\/nrs.jpg&quot;,&quot;type&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/6304e9780b08ed17710eb816\\\/procollege-RTS1PXJM.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;White House Moving toward Canceling $10K in Student Debt for Certain Borrowers&quot;}},{&quot;clickthrough&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/videos\\\/judge-formally-rejects-doj-request-to-seal-entire-mar-a-lago-search-warrant-affidavit\\\/&quot;,&quot;poster&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/wp-content\\\/uploads\\\/2022\\\/11\\\/nrs.jpg&quot;,&quot;type&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/6303beff7a5ed86565515267\\\/pro-RTS1PXJM%202.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;Judge Formally Rejects DOJ Request to Seal Entire Mar-a-Lago Search Warrant Affidavit&quot;}},{&quot;clickthrough&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/videos\\\/liz-cheney-thinking-about-2024-presidential-run-after-losing-primary-to-trump-backed-challenger\\\/&quot;,&quot;poster&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/wp-content\\\/uploads\\\/2022\\\/11\\\/nrs.jpg&quot;,&quot;type&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/62fd0f9073aae4255f2afdc2\\\/pro--NR%20Originals_1.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;Liz Cheney \\u2018Thinking about\\u2019 2024 Presidential Run after Losing Primary to Trump-Backed Challenger&quot;}},{&quot;clickthrough&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/videos\\\/putin-kim-jong-un-pledge-to-expand-bilateral-cooperation\\\/&quot;,&quot;poster&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/wp-content\\\/uploads\\\/2022\\\/11\\\/nrs.jpg&quot;,&quot;type&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/62fa7fb3094df4727b379864\\\/pro111-RTS1PXJM.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;Putin, Kim Jong-Un Pledge to Expand Bilateral Cooperation&quot;}},{&quot;clickthrough&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/videos\\\/trump-says-fbi-raided-mar-a-lago\\\/&quot;,&quot;poster&quot;:&quot;https:\\\/\\\/www.nationalreview.com\\\/wp-content\\\/uploads\\\/2022\\\/11\\\/nrs.jpg&quot;,&quot;type&quot;:&quot;video&quot;,&quot;url&quot;:&quot;https:\\\/\\\/play.aniview.com\\\/60d5e58543972f2377389576\\\/62f26bb385f4146e14270805\\\/protrumpraid.mp4&quot;,&quot;entry&quot;:{&quot;name&quot;:&quot;Trump Says FBI Raided Mar-a-Lago&quot;}}]\" variant=\"instreamFloating\"><\/AniviewVideo><\/div>\n<AdUnit name=\"incontent-1-mobile\" baseUnitName=\"incontent-1\" unitType=\"mobile\"><\/AdUnit>\n<AdUnit name=\"incontent-1-desktop\" baseUnitName=\"incontent-1\" unitType=\"desktop\"><\/AdUnit><TopStories desktop=\"true\" variant=\"default\"><\/TopStories>\n<p>While HBO created what may be modernity\u2019s last instance of shared popular culture (nothing will reach <em>Sopranos<\/em>-like <a href=\"https:\/\/www.vulture.com\/2013\/06\/game-of-thrones-huge-ratings-chart.html\" target=\"_blank\" rel=\"noopener\">ratings<\/a> ever again, as the later seasons of <em>Game of Thrones<\/em> managed), much of the show\u2019s best stuff was lifted straight from the books. The characters lost within political labyrinths, often of their own making; the sense of mystery and impending doom that lingers over the Night King and his army of White Walkers; even the racy, sex-crazed parts of the show (artifacts from the last years in which Americans could be scandalized by media) \u2014 all are present in Martin\u2019s original.<\/p>\n<Connatix><\/Connatix>\n<p>The character of Tyrion Lannister provides one of the most compelling examples of this \u201cone-for-one\u201d quality between the book and the show. Tyrion is a variant of the slacker-genius archetype, granted a perfect combination of wit and political instinct, along with Martin\u2019s down-to-earth depiction of how such a troubled-yet-brilliant tactician might think and act.<\/p>\n<p>The character himself is not that revolutionary \u2014 someone with even basic cultural literacy in movies and books has seen many slacker-geniuses \u2014 but Martin\u2019s uncanny prose style contains a detailed realism that brings Tyrion to life on the page.<\/p>\n<p>Peter Dinklage\u2019s on-screen depiction of Tyrion matches the book pitch-perfectly. Not since Peter Jackson cast a B-list Danish-American <a href=\"https:\/\/www.newyorker.com\/magazine\/2016\/05\/16\/viggo-mortensen-as-camus\" target=\"_blank\" rel=\"noopener\">art snob<\/a> for the role of Aragorn, King of Gondor (and Arnor!), has a fantasy actor surprised audiences by rising so fully to the occasion, as Dinklage did with Tyrion, a boozing but brilliant man with dwarfism. Debauched, yes; but not so badly by the standards of debauchery within the Lannister family.<\/p>\n<AdUnit name=\"incontent-2-desktop\" baseUnitName=\"incontent-2\" unitType=\"desktop\"><\/AdUnit><MoreInTag desktop=\"true\" variant=\"default\"><\/MoreInTag>\n<AdUnit name=\"incontent-2-mobile\" baseUnitName=\"incontent-2\" unitType=\"mobile\"><\/AdUnit><TopStories mobile=\"true\" variant=\"default\"><\/TopStories>\n<p>In fact, to describe Tyrion is also pretty much to describe this first book \u2014 and Martin\u2019s entire saga: coarsely obsessed with politics, to the exclusion of almost everything else (except for occasional bouts of sex and\/or violence).<\/p>\n<p>Martin\u2019s Machiavellian revolution of modern fantasy literature has its merits, but his series betrays the genre with just how <em>un-fantastical<\/em> it is. While he keeps the basic trappings and tropes of fantasy (esoteric magic, castles, dragons, royalty, extensive background lore, spooky-sounding dead languages, etc.), Martin\u2019s revealed preference is instead to use fantasy as a backdrop or window dressing for what is essentially a type of bloated Agatha Christie plotline.<\/p>\n<p>Much of <em>A Game of Thrones<\/em>\u2019s plot centers on a \u201cwhodunit\u201d mystery, as Catelyn Stark, the matriarch of the Stark family, our protagonists, scurries around like <a href=\"https:\/\/www.youtube.com\/watch?v=4-vjbuodBEU\" target=\"_blank\" rel=\"noopener\">Harrison Ford<\/a> desperately trying to discover who ordered a failed assassination attempt on her son, Bran. What\u2019s so odd is that the reader\u2019s immediate intuitions about the identity of the evil mastermind are effectively confirmed by the end of the series. The quest to find the schemer just drops out of the story over the next four books, and the deflated resolution to this plotline has only ever occurred in the show (Martin failed to catch up with the breakneck pace of HBO\u2019s programming). Within the pages of this first book, though, the assassination plotline goes nowhere as the reader witnesses the characters become practically amnesiac about it in real time.<\/p>\n<AdUnit name=\"incontent-3-desktop\" baseUnitName=\"incontent-3\" unitType=\"desktop\"><\/AdUnit><MoreFromAuthor desktop=\"true\" variant=\"default\"><\/MoreFromAuthor>\n<AdUnit name=\"incontent-3-mobile\" baseUnitName=\"incontent-3\" unitType=\"mobile\"><\/AdUnit><MoreInTag mobile=\"true\" variant=\"default\"><\/MoreInTag>\n<p>None of this is to say that <em>A Game of Thrones <\/em>lacks dramatic merit. While it is true that Catelyn and Bran are duds, most of the vast array of characters Martin crams into the book have singular, interesting personalities. The stoic, honorable Ned Stark is remarkably different from many of the overstated, bombastic male characters in the fantasy stylings of the time, and Martin\u2019s decision to . . . er, <em>let certain events <\/em>happen to him provides a genuinely dramatic twist. Martin shows a willingness to put his most interesting characters in peril through the book, meaning that the reader can never be completely sure that the most interesting protagonists are safe from harm.<\/p>\n<p>Martin\u2019s best storytelling tactics are synthesized in the character of Sansa Stark, the eldest daughter of the family, and one of the more underrated characters of modern fantasy. She has the calculating brilliance like many others in <em>A Game of Thrones<\/em> (including Tyrion, but equally Littlefinger and Varys). Unlike many of these others, however, Martin puts her in a situation that is uniquely perilous right from the get-go.<\/p>\n<ArticleNewsletter mobile=\"true\"><\/ArticleNewsletter>\n<p>Events in the first book lead to Sansa\u2019s being effectively kidnapped and used as a bargaining chip by the Lannister family for much of the rest of the saga. But the Lannisters, in their extreme cruelty, are in constant debate about whether or not Sansa is worth keeping around, given all of the trouble and political hassle she generates. Sansa\u2019s chapters in <em>A Game of Thrones<\/em> show Martin\u2019s obsession with cynical politics at its best, as the clear and present danger of Sansa\u2019s circumstances forces her to devise ever cleverer and more pointed rhetorical schemes to justify her value as a living hostage to the Lannisters. Through the whole saga, Sansa\u2019s politicking is unmatched in its brilliance. But the narrative come-down is agonizing and slow for Sansa; her reward at the end of the saga for her incredible displays of political instinct is entirely predictable, and observant readers will likely be able to guess the outcome for Sansa based on the information he or she has access to in this first book. Readers cannot help but feel that Sansa\u2019s author has gifted her a consolation prize.<\/p>\n<AdUnit name=\"incontent-4-desktop\" baseUnitName=\"incontent-4\" unitType=\"desktop\"><\/AdUnit>\n<p>In this sense, Martin presages the \u201csubverting expectations\u201d silliness that has obsessed other modern, \u201cgritty\u201d storytellers. That phenomenon went from a simmer to a full boil a few years ago with Rian Johnson\u2019s treatment of <em>Star Wars <\/em>in <em>The Last Jedi<\/em> \u2014 a film in which the audience\u2019s expectations are subverted (as the memes from this period <a href=\"https:\/\/knowyourmeme.com\/memes\/subverting-expectations\" target=\"_blank\" rel=\"noopener\">remind<\/a> us) precisely because nothing is surprising, and almost every character\u2019s story fails to pay off. <em>A Song of Ice and Fire <\/em>does the same thing, just on a larger scale and with more complex plot mechanics \u2014 which is what makes it even more frustrating.<\/p>\n<p>These markers of Martin\u2019s storytelling \u2014 the crude, matter-of-fact methods by which he quashes the reader\u2019s hope for a higher mystery within the story, the way the book becomes predictable as the reader grows accustomed to interpreting every event through a lens of cynical Machiavellianism \u2014 have come to define modern \u201cdark fantasy.\u201d<\/p>\n<p>To <a href=\"https:\/\/ricochet.com\/podcast\/goldberg-long-podhoretz\/the-wrap-on-thrones\/\" target=\"_blank\" rel=\"noopener\">crib<\/a> an <a href=\"https:\/\/www.nytimes.com\/2019\/05\/21\/opinion\/game-of-thrones-finale.html\" target=\"_blank\" rel=\"noopener\">argument<\/a> from Ross Douthat, \u201cdark fantasy\u201d was originally an imprecise term to describe the attitudinal approach of authors who wanted to write darker, grittier, or horror-inspired versions of fantasy. But given time, dark fantasy came to describe novels set in a pseudo-mythological past that was, for all intents and purposes, godless.<\/p>\n<AdUnit name=\"incontent-4-mobile\" baseUnitName=\"incontent-4\" unitType=\"mobile\"><\/AdUnit><MoreFromAuthor mobile=\"true\" variant=\"default\"><\/MoreFromAuthor>\n<AdUnit name=\"incontent-5-desktop\" baseUnitName=\"incontent-1\" unitType=\"desktop\"><\/AdUnit>\n<p>To be sure, dark fantasies are replete with \u201cdeities,\u201d such as Arioch, one of the beings known as Chaos Lords in <em>Elric of Melnibone <\/em>by Michael Moorcock. Arioch serves as King Elric\u2019s perverse guardian angel, granting him power and knowledge as Elric becomes his thrall. But Arioch could only be called a \u201cgod\u201d in a polytheistic sense. He\u2019s just one of countless equally powerful, magical, undying entities that vie for control over the material world.<\/p>\n<p>Generally, dark fantasy lacks a capital-G God in the biblical sense. There are rarely figures that could be considered the Lord of creation \u2014 instead, authors build worlds wherein supernatural power is non-omnipotent, limiting the scope of any one deity\u2019s ambition. Godly magic in such settings remains factional \u2014 power remains firmly in the realm of the political, the coalitional, and in the harsh mathematics of risk and reward.<\/p>\n<p>By this definition, <em>A Game of Thrones <\/em>would appear to be a snug fit within the confines of dark fantasy. It could even be the subgenre\u2019s high point, as Martin strips away as much stereotypical magical fantasy imagery as possible. Sure, there are dragons, there are magical ice people, and there are suggestions of sorcery originating in far-flung exotic lands. But the reader spends a vanishingly small proportion of the story considering such impossible elements, as Martin opts for greater amounts of <em>realpolitik <\/em>and court-intrigue. The fantastical elements make comebacks at moments when their reality-bending capabilities serve a dramatic climax, but they then recede into the background. The major exception to this is the dragons, which Martin dedicates more and more time to as the books go on, and which become increasingly tedious as he forces the reader to care about the flying death cannons, <em>with hearts of gold<\/em>.<\/p>\n<AdUnit name=\"incontent-6-desktop\" baseUnitName=\"incontent-2\" unitType=\"desktop\"><\/AdUnit>\n<p>But Martin inverts the basic ethic at work in dark fantasy: that the world\u2019s cruel politics are not the point of the story. This ethic is why dark fantasy tends to be interesting in the first place; it shows characters who live in a fundamentally pagan world, where no higher power guides world events toward the good, where people suffer not only needlessly and excessively in the material world, but often eternally in the afterlife as well, with no redemptive pathway.<\/p>\n<AdUnit name=\"incontent-5-mobile\" baseUnitName=\"incontent-1\" unitType=\"mobile\"><\/AdUnit>\n<p>Through this cynical interpretation of human life, dark-fantasy authors often arrive at profound observations about humanity\u2019s character by showing readers how their protagonists adapt to a world without a biblical ethic, where there is no clear spiritual reward in doing good for good\u2019s sake, even (and especially) when doing so is difficult.<\/p>\n<p>Such an ethos means that dark-fantasy authors often eschew the complex political schemes developed earlier in their work as their sagas continue. Their protagonists come to understand that doing anything good in their fallen world requires individual action outside the purview of corrupt institutions. One of Elric\u2019s first actions is to abandon his post as king, for example.<\/p>\n<AdUnit name=\"incontent-7-desktop\" baseUnitName=\"incontent-3\" unitType=\"desktop\"><\/AdUnit>\n<p>Not for Martin, though \u2014 <em>A Game of Thrones <\/em>sets the tone for the whole series, as it is procedurally revealed that there is nothing beyond conventional politics for this author. There are no events in the saga not swallowed up by court-intrigue, political assassination, cynical demagoguery, the politics of sex, the politics of violence, the politics of . . . politics, on and on forever. Even the White Walkers, introduced in the first book, do not bring about major political shifts until later in the story &#8212; and even then, their presence does not completely end the books&#8217; trademark political maneuvering.<\/p>\n<p>Martin may have therefore sacrificed the one method of achieving a hero\u2019s arc in a dark fantasy setting \u2014 by reasserting humanity\u2019s rare-but-necessary acts of simple, unprompted, unrequited goodness, and by explicating the ways in which such goodness is heroic \u2014 in exchange for <em>even more<\/em> darkness, grit, and nastiness.<\/p>\n<AdUnit name=\"incontent-6-mobile\" baseUnitName=\"incontent-2\" unitType=\"mobile\"><\/AdUnit>\n<p>But the result is that the story is actually rather safe. Once the reader becomes desensitized to the story\u2019s brutality, and to the fact that Martin has a tendency to \u201csubvert\u201d expectations by simply confirming one\u2019s worst fears rather than through genuine surprise or inventiveness, it becomes easy enough to read the stage directions in advance. For proof &#8212; and spoilers &#8212; look no further than Ben Shapiro, who <a href=\"https:\/\/www.youtube.com\/watch?v=WuXJsd5bX98\" target=\"_blank\" rel=\"noopener\">predicted<\/a> an almost entirely accurate version of the HBO show\u2019s ending for years. Facts really don\u2019t care about George R. R. Martin\u2019s feelings, evidently.<\/p>\n<AdUnit name=\"incontent-8-desktop\" baseUnitName=\"incontent-4\" unitType=\"desktop\"><\/AdUnit>\n<p>The rinse-repeat quality of the story isn\u2019t completely obvious by the end of this first book, now turning a quarter-century old. Fantasy nerds would be forgiven for picking up the next installment &#8212; as many of them did &#8212; to see how their favorite characters would escape Martin\u2019s grim entanglements. But the boundless cynicism of <em>A Game of Thrones<\/em>\u2019s politics begins to wear on attentive readers (and perhaps even on the book\u2019s author, who has yet to finish his series), much as the boundless cynicism of, well, the real world\u2019s politics do. Reality is filled with political capriciousness, suspicion, and frighteningly boring corruption. May the fantasy readers of the next 25 years realize that we don\u2019t need it in our fiction, too.<\/p>\n","protected":false},"excerpt":{"rendered":"<p>George R. R. Martin authored an impressive dark fantasy that nonetheless betrayed the genre\u2019s core mission.<\/p>\n","protected":false},"author":127,"featured_media":971300,"comment_status":"open","ping_status":"closed","sticky":false,"template":"","format":"standard","meta":{"hide-more-from-author":false,"disable-remixd":false,"hide_top_stories":false,"_links_to":"","_links_to_type":0,"original-print-title":"","hide-nrplus":"1","social":{"tweet":"","share-chart":false}},"categories":[5315,6932,1290],"tags":[3626],"section":[615],"jetpack_featured_media_url":"https:\/\/www.nationalreview.com\/wp-content\/uploads\/2021\/08 licans-expected-to-reverse-decision-stripping-disney-of-autonomy-over-walt-disney-world-property\/","title":"Florida Republicans Expected to Reverse Decision Stripping Disney of Autonomy over Walt Disney World Property","author":"Isaac Schorr","section":"news","premium":false,"capital_matters":false},{"image_url":"https:\/\/www.nationalreview.com\/wp-content\/uploads\/2022\/09\/musk.jpg?fit=789%2C460","url":"https:\/\/www.nationalreview.com\/2022\/12\/the-meltdown-over-elon-musks-covid-misinformation-policy\/","title":"The Meltdown over Elon Musk\u2019s Covid-Misinformation Policy","author":"Nate Hochman","section":"articles","premium":true,"capital_matters":false},{"image_url":"https:\/\/www.nationalreview.com\/wp-content\/uploads\/2022\/03\/DTRUMP.jpg?fit=789%2C460","url":"https:\/\/www.nationalreview.com\/corner\/brutal-numbers-for-trump\/","title":"Brutal Numbers for Trump","author":"Rich Lowry","section":"corner","premium":false,"capital_matters":false}]},"headers":{"Cache-Control":"max-age=60"}},"\/wp\/v2\/posts?cap-author=nicholas-pompella&per_page=3":{"body":[{"id":971292,"date":"2021-08-07T06:30:35","date_gmt":"2021-08-07T10:30:35","guid":{"rendered":"https:\/\/www.nationalreview.com\/?p=971292"},"modified":"2021-08-07T04:29:22","modified_gmt":"2021-08-07T08:29:22","slug":"25-years-on-a-mixed-legacy-for-a-game-of-thrones","status":"publish","type":"post","link":"https:\/\/www.nationalreview.com\/2021\/08\/25-years-on-a-mixed-legacy-for-a-game-of-thrones\/","title":{"rendered":"25 Years on, a Mixed Legacy for <em>A Game of Thrones<\/em>"},"content":{"rendered":"<p><span class=\"drop\">T<\/span><span class=\"small_caps\">his<\/span> month, <em>A Game of Thrones<\/em> by acclaimed fantasy author George R. R. Martin turns 25. While Martin\u2019s book series \u2014 collectively titled <em>A Song of Ice and Fire<\/em> \u2014 is inseparable from <a href=\"https:\/\/www.nationalreview.com\/tag\/game-of-thrones\/\" target=\"_blank\" rel=\"noopener\">the more popular HBO adaptation<\/a>, the books were what originally spurred a massive tonal shift in fantasy literature that the show simply imitated.<\/p>\n<p>While HBO created what may be modernity\u2019s last instance of shared popular culture (nothing will reach <em>Sopranos<\/em>-like <a href=\"https:\/\/www.vulture.com\/2013\/06\/game-of-thrones-huge-ratings-chart.html\" target=\"_blank\" rel=\"noopener\">ratings<\/a> ever again, as the later seasons of <em>Game of Thrones<\/em> managed), much of the show\u2019s best stuff was lifted straight from the books. The characters lost within political labyrinths, often of their own making; the sense of mystery and impending doom that lingers over the Night King and his army of White Walkers; even the racy, sex-crazed parts of the show (artifacts from the last years in which Americans could be scandalized by media) \u2014 all are present in Martin\u2019s original.<\/p>\n<p>The character of Tyrion Lannister provides one of the most compelling examples of this \u201cone-for-one\u201d quality between the book and the show. Tyrion is a variant of the slacker-genius archetype, granted a perfect combination of wit and political instinct, along with Martin\u2019s down-to-earth depiction of how such a troubled-yet-brilliant tactician might think and act.<\/p>\n<p>The character himself is not that revolutionary \u2014 someone with even basic cultural literacy in movies and books has seen many slacker-geniuses \u2014 but Martin\u2019s uncanny prose style contains a detailed realism that brings Tyrion to life on the page.<\/p>\n<p>Peter Dinklage\u2019s on-screen depiction of Tyrion matches the book pitch-perfectly. Not since Peter Jackson cast a B-list Danish-American <a href=\"https:\/\/www.newyorker.com\/magazine\/2016\/05\/16\/viggo-mortensen-as-camus\" target=\"_blank\" rel=\"noopener\">art snob<\/a> for the role of Aragorn, King of Gondor (and Arnor!), has a fantasy actor surprised audiences by rising so fully to the occasion, as Dinklage did with Tyrion, a boozing but brilliant man with dwarfism. Debauched, yes; but not so badly by the standards of debauchery within the Lannister family.<\/p>\n<p>In fact, to describe Tyrion is also pretty much to describe this first book \u2014 and Martin\u2019s entire saga: coarsely obsessed with politics, to the exclusion of almost everything else (except for occasional bouts of sex and\/or violence).<\/p>\n<p>Martin\u2019s Machiavellian revolution of modern fantasy literature has its merits, but his series betrays the genre with just how <em>un-fantastical<\/em> it is. While he keeps the basic trappings and tropes of fantasy (esoteric magic, castles, dragons, royalty, extensive background lore, spooky-sounding dead languages, etc.), Martin\u2019s revealed preference is instead to use fantasy as a backdrop or window dressing for what is essentially a type of bloated Agatha Christie plotline.<\/p>\n<p>Much of <em>A Game of Thrones<\/em>\u2019s plot centers on a \u201cwhodunit\u201d mystery, as Catelyn Stark, the matriarch of the Stark family, our protagonists, scurries around like <a href=\"https:\/\/www.youtube.com\/watch?v=4-vjbuodBEU\" target=\"_blank\" rel=\"noopener\">Harrison Ford<\/a> desperately trying to discover who ordered a failed assassination attempt on her son, Bran. What\u2019s so odd is that the reader\u2019s immediate intuitions about the identity of the evil mastermind are effectively confirmed by the end of the series. The quest to find the schemer just drops out of the story over the next four books, and the deflated resolution to this plotline has only ever occurred in the show (Martin failed to catch up with the breakneck pace of HBO\u2019s programming). Within the pages of this first book, though, the assassination plotline goes nowhere as the reader witnesses the characters become practically amnesiac about it in real time.<\/p>\n<p>None of this is to say that <em>A Game of Thrones <\/em>lacks dramatic merit. While it is true that Catelyn and Bran are duds, most of the vast array of characters Martin crams into the book have singular, interesting personalities. The stoic, honorable Ned Stark is remarkably different from many of the overstated, bombastic male characters in the fantasy stylings of the time, and Martin\u2019s decision to . . . er, <em>let certain events <\/em>happen to him provides a genuinely dramatic twist. Martin shows a willingness to put his most interesting characters in peril through the book, meaning that the reader can never be completely sure that the most interesting protagonists are safe from harm.<\/p>\n<p>Martin\u2019s best storytelling tactics are synthesized in the character of Sansa Stark, the eldest daughter of the family, and one of the more underrated characters of modern fantasy. She has the calculating brilliance like many others in <em>A Game of Thrones<\/em> (including Tyrion, but equally Littlefinger and Varys). Unlike many of these others, however, Martin puts her in a situation that is uniquely perilous right from the get-go.<\/p>\n<p>Events in the first book lead to Sansa\u2019s being effectively kidnapped and used as a bargaining chip by the Lannister family for much of the rest of the saga. But the Lannisters, in their extreme cruelty, are in constant debate about whether or not Sansa is worth keeping around, given all of the trouble and political hassle she generates. Sansa\u2019s chapters in <em>A Game of Thrones<\/em> show Martin\u2019s obsession with cynical politics at its best, as the clear and present danger of Sansa\u2019s circumstances forces her to devise ever cleverer and more pointed rhetorical schemes to justify her value as a living hostage to the Lannisters. Through the whole saga, Sansa\u2019s politicking is unmatched in its brilliance. But the narrative come-down is agonizing and slow for Sansa; her reward at the end of the saga for her incredible displays of political instinct is entirely predictable, and observant readers will likely be able to guess the outcome for Sansa based on the information he or she has access to in this first book. Readers cannot help but feel that Sansa\u2019s author has gifted her a consolation prize.<\/p>\n<p>In this sense, Martin presages the \u201csubverting expectations\u201d silliness that has obsessed other modern, \u201cgritty\u201d storytellers. That phenomenon went from a simmer to a full boil a few years ago with Rian Johnson\u2019s treatment of <em>Star Wars <\/em>in <em>The Last Jedi<\/em> \u2014 a film in which the audience\u2019s expectations are subverted (as the memes from this period <a href=\"https:\/\/knowyourmeme.com\/memes\/subverting-expectations\" target=\"_blank\" rel=\"noopener\">remind<\/a> us) precisely because nothing is surprising, and almost every character\u2019s story fails to pay off. <em>A Song of Ice and Fire <\/em>does the same thing, just on a larger scale and with more complex plot mechanics \u2014 which is what makes it even more frustrating.<\/p>\n<p>These markers of Martin\u2019s storytelling \u2014 the crude, matter-of-fact methods by which he quashes the reader\u2019s hope for a higher mystery within the story, the way the book becomes predictable as the reader grows accustomed to interpreting every event through a lens of cynical Machiavellianism \u2014 have come to define modern \u201cdark fantasy.\u201d<\/p>\n<p>To <a href=\"https:\/\/ricochet.com\/podcast\/goldberg-long-podhoretz\/the-wrap-on-thrones\/\" target=\"_blank\" rel=\"noopener\">crib<\/a> an <a href=\"https:\/\/www.nytimes.com\/2019\/05\/21\/opinion\/game-of-thrones-finale.html\" target=\"_blank\" rel=\"noopener\">argument<\/a> from Ross Douthat, \u201cdark fantasy\u201d was originally an imprecise term to describe the attitudinal approach of authors who wanted to write darker, grittier, or horror-inspired versions of fantasy. But given time, dark fantasy came to describe novels set in a pseudo-mythological past that was, for all intents and purposes, godless.<\/p>\n<p>To be sure, dark fantasies are replete with \u201cdeities,\u201d such as Arioch, one of the beings known as Chaos Lords in <em>Elric of Melnibone <\/em>by Michael Moorcock. Arioch serves as King Elric\u2019s perverse guardian angel, granting him power and knowledge as Elric becomes his thrall. But Arioch could only be called a \u201cgod\u201d in a polytheistic sense. He\u2019s just one of countless equally powerful, magical, undying entities that vie for control over the material world.<\/p>\n<p>Generally, dark fantasy lacks a capital-G God in the biblical sense. There are rarely figures that could be considered the Lord of creation \u2014 instead, authors build worlds wherein supernatural power is non-omnipotent, limiting the scope of any one deity\u2019s ambition. Godly magic in such settings remains factional \u2014 power remains firmly in the realm of the political, the coalitional, and in the harsh mathematics of risk and reward.<\/p>\n<p>By this definition, <em>A Game of Thrones <\/em>would appear to be a snug fit within the confines of dark fantasy. It could even be the subgenre\u2019s high point, as Martin strips away as much stereotypical magical fantasy imagery as possible. Sure, there are dragons, there are magical ice people, and there are suggestions of sorcery originating in far-flung exotic lands. But the reader spends a vanishingly small proportion of the story considering such impossible elements, as Martin opts for greater amounts of <em>realpolitik <\/em>and court-intrigue. The fantastical elements make comebacks at moments when their reality-bending capabilities serve a dramatic climax, but they then recede into the background. The major exception to this is the dragons, which Martin dedicates more and more time to as the books go on, and which become increasingly tedious as he forces the reader to care about the flying death cannons, <em>with hearts of gold<\/em>.<\/p>\n<p>But Martin inverts the basic ethic at work in dark fantasy: that the world\u2019s cruel politics are not the point of the story. This ethic is why dark fantasy tends to be interesting in the first place; it shows characters who live in a fundamentally pagan world, where no higher power guides world events toward the good, where people suffer not only needlessly and excessively in the material world, but often eternally in the afterlife as well, with no redemptive pathway.<\/p>\n<p>Through this cynical interpretation of human life, dark-fantasy authors often arrive at profound observations about humanity\u2019s character by showing readers how their protagonists adapt to a world without a biblical ethic, where there is no clear spiritual reward in doing good for good\u2019s sake, even (and especially) when doing so is difficult.<\/p>\n<p>Such an ethos means that dark-fantasy authors often eschew the complex political schemes developed earlier in their work as their sagas continue. Their protagonists come to understand that doing anything good in their fallen world requires individual action outside the purview of corrupt institutions. One of Elric\u2019s first actions is to abandon his post as king, for example.<\/p>\n<p>Not for Martin, though \u2014 <em>A Game of Thrones <\/em>sets the tone for the whole series, as it is procedurally revealed that there is nothing beyond conventional politics for this author. There are no events in the saga not swallowed up by court-intrigue, political assassination, cynical demagoguery, the politics of sex, the politics of violence, the politics of . . . politics, on and on forever. Even the White Walkers, introduced in the first book, do not bring about major political shifts until later in the story &#8212; and even then, their presence does not completely end the books&#8217; trademark political maneuvering.<\/p>\n<p>Martin may have therefore sacrificed the one method of achieving a hero\u2019s arc in a dark fantasy setting \u2014 by reasserting humanity\u2019s rare-but-necessary acts of simple, unprompted, unrequited goodness, and by explicating the ways in which such goodness is heroic \u2014 in exchange for <em>even more<\/em> darkness, grit, and nastiness.<\/p>\n<p>But the result is that the story is actually rather safe. Once the reader becomes desensitized to the story\u2019s brutality, and to the fact that Martin has a tendency to \u201csubvert\u201d expectations by simply confirming one\u2019s worst fears rather than through genuine surprise or inventiveness, it becomes easy enough to read the stage directions in advance. For proof &#8212; and spoilers &#8212; look no further than Ben Shapiro, who <a href=\"https:\/\/www.youtube.com\/watch?v=WuXJsd5bX98\" target=\"_blank\" rel=\"noopener\">predicted<\/a> an almost entirely accurate version of the HBO show\u2019s ending for years. Facts really don\u2019t care about George R. R. Martin\u2019s feelings, evidently.<\/p>\n<p>The rinse-repeat quality of the story isn\u2019t completely obvious by the end of this first book, now turning a quarter-century old. Fantasy nerds would be forgiven for picking up the next installment &#8212; as many of them did &#8212; to see how their favorite characters would escape Martin\u2019s grim entanglements. But the boundless cynicism of <em>A Game of Thrones<\/em>\u2019s politics begins to wear on attentive readers (and perhaps even on the book\u2019s author, who has yet to finish his series), much as the boundless cynicism of, well, the real world\u2019s politics do. Reality is filled with political capriciousness, suspicion, and frighteningly boring corruption. May the fantasy readers of the next 25 years realize that we don\u2019t need it in our fiction, too.<\/p>\n","protected":false},"excerpt":{"rendered":"<p>George R. R. Martin authored an impressive dark fantasy that nonetheless betrayed the genre\u2019s core mission.<\/p>\n","protected":false},"author":127,"featured_media":971300,"comment_status":"open","ping_status":"closed","sticky":false,"template":"","format": "https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/types\/post"}],"author":[{"embeddable":true,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/users\/127"}],"replies":[{"embeddable":true,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/comments?post=971292"}],"version-history":[{"count":4,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/posts\/971292\/revisions"}],"predecessor-version":[{"id":971325,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/posts\/971292\/revisions\/971325"}],"wp:featuredmedia":[{"embeddable":true,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/media\/971300"}],"wp:attachment":[{"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/media?parent=971292"}],"wp:term":[{"taxonomy":"category","embeddable":true,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/categories?post=971292"},{"taxonomy":"post_tag","embeddable":true,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/tags?post=971292"},{"taxonomy":"section","embeddable":true,"href":"https:\/\/www.nationalreview.com\/wp-json\/wp\/v2\/section?post=971292"}],"curies":[{"name":"wp","href":"https:\/\/api.w.org\/{rel}","templated":true}]}},{"id":875883,"date":"2020-11-21T06:30:56","date_gmt":"2020-11-21T11:30:56","guid":{"rendered":"https:\/\/www.nationalreview.com\/?p=875883"},"modified":"2020-11-21T00:39:51","modified_gmt":"2020-11-21T05:39:51","slug":"harold-bloom-the-essential-american-literary-critic","status":"publish","type":"post","link":"https:\/\/www.nationalreview.com\/2020\/11\/harold-bloom-the-essential-american-literary-critic\/","title":{"rendered":"Harold Bloom: The Essential American Literary Critic"},"content":{"rendered":"<p><span class=\"drop\">H<\/span><span class=\"small_caps\">arold Bloom<\/span> was a strange, singular figure: an old-school, elbow-patches academic in literary criticism who managed to generate heated controversy whenever he spoke. Like other great American art critics \u2014 Roger Ebert, for instance \u2014 he was as famous for his harsh, polemical critiques as for how beautifully he described the art he loved.<\/p>\n<p>Bloom was the center of gravity around which American arts and letters rotated, and <a href=\"https:\/\/www.nationalreview.com\/2019\/10\/james-prosek-an-american-original\/\" target=\"_blank\" rel=\"noopener noreferrer\">his death late last year<\/a> was a major blow.<\/p>\n<p>Fortunately, Bloom was unusually prolific. He published at a blistering pace after getting tenure, an accolade that typically has the opposite effect on professors. <a href=\"https:\/\/www.amazon.com\/American-Canon-Literary-Emerson-Pynchon\/dp\/1598536400\" target=\"_blank\" rel=\"noopener noreferrer\"><em>The American Canon<\/em><\/a> \u2014 published the day after Bloom\u2019s death \u2014 is therefore a treasure trove, as the book collates a sizable number of Bloom\u2019s American literary critiques that would\u2019ve otherwise been printed only once across a vast array of separate volumes (some of which were published five decades ago), leaving them effectively lost to time for modern readers.<\/p>\n<p>The collection begins with Ralph Waldo Emerson and proceeds along a sequence of increasingly modern authors. This construction creates a narrative thread, wherein Bloom argues that authors took cues from their immediate predecessors: Whitman wrote <em>Song of Myself <\/em>with Emerson in mind, Hawthorne composed <em>The Scarlet Letter <\/em>responding to both Emerson and Whitman, and so on.<\/p>\n<p>Emerson is therefore presented as American literature\u2019s genesis \u2014 the founder of a national cultural movement to whom every succeeding American author owes something. When Bloom writes of Emerson and his ideas, he is simultaneously at his best, his weirdest, and his most patriotic. This eclectic mix is what makes the book a delight, and a timely release at a moment when American patriotism\u2019s fundamental value <a href=\"https:\/\/www.vox.com\/2015\/7\/2\/8884885\/american-revolution-mistake\" target=\"_blank\" rel=\"noopener noreferrer\">is<\/a> <a href=\"https:\/\/pulitzercenter.org\/lesson-plan-grouping\/1619-project-curriculum\" target=\"_blank\" rel=\"noopener noreferrer\">contested<\/a>.<\/p>\n<p>Bloom\u2019s weirdness is on full display when claiming that Emerson\u2019s \u201cSelf-Reliance\u201d essay marked the founding of an \u201cAmerican religion\u201d of radical independence. He doesn\u2019t use \u201creligion\u201d metaphorically \u2014 Bloom is preoccupied with the idea of the heroic individual asserting his will on the world. This is part of Bloom\u2019s lifelong obsession with Gnosticism, a religion of \u201csecret\u201d knowledge that only the spiritual elite were enlightened enough to possess.<\/p>\n<p>Bloom sees imprints of this gnostic spirituality in America\u2019s literature. However strange it sounds, this is the basis of Bloom\u2019s patriotism, which is of a peculiar left-wing variety that\u2019s almost unheard of now. These atypical patriotic attachments make Bloom a liberal in a pure sense. He finds a tradition of radical individualism in American culture, with a through-line in every great American author\u2019s work. This elides the history of early American Christianity. Bloom hardly addresses the contradiction. But it is true that many of America\u2019s great authors were either <a href=\"https:\/\/poets.org\/poem\/song-myself-32\" target=\"_blank\" rel=\"noopener noreferrer\">skeptical<\/a> of religion or outright <a href=\"https:\/\/quod.lib.umich.edu\/e\/emerson\/4957107.0011.001\/499:33\" target=\"_blank\" rel=\"noopener noreferrer\">disestablishmentarian<\/a>.<\/p>\n<p>So, why bother with Bloom? For one, his odd New Age leftist patriotism made him un-cancellable. He was that rare intellectual who defended America from the left. He wrote in 1994 that critical theorists and the identitarian Left were destroying the West\u2019s artistic legacy. He even lumped \u201cneoconservatives\u201d into his list of offenders and <a href=\"https:\/\/quillette.com\/2016\/04\/08\/harold-bloom-and-aesthetics-in-an-age-of-piety\/\" target=\"_blank\" rel=\"noopener noreferrer\">named the collective hodgepodge<\/a> the \u201cSchool of Resentment,\u201d which he believed flourished in nearly every college English department.<\/p>\n<p>Bloom was impressive for never being cowed by his critics. He simply didn\u2019t care. His artistic obsessions gave him the unblinking courage to assert that authors will always cease to create literature when they waste time scrambling to meet the ever-shifting goalposts of political correctness. As he notes in <em>The American Canon<\/em>, \u201csocial information . . . seems to me a peripheral gain of reading, and political awareness an even more tenuous dividend.\u201d<\/p>\n<p>This moment seems tailor-made for <em>The American Canon<\/em>\u2019s release. The book-banning craze, often associated with 20th-century Evangelicalism, has now come <a href=\"https:\/\/www.nationalreview.com\/2016\/12\/banning-huckleberry-finn-racial-slurs-virginia-school\/\" target=\"_blank\" rel=\"noopener noreferrer\">full circle<\/a> in socially liberal educational silos. But this impulse still reappears in conservative spaces \u2014 often with the same American books that were declared too obscene nearly a <a href=\"https:\/\/www.nytimes.com\/2020\/04\/29\/books\/palmer-alaska-school-board-books.html\" target=\"_blank\" rel=\"noopener noreferrer\">century<\/a> ago. The \u201clive-and-let-live\u201d approach to art is disintegrating, as both the cultural Right and Left have decided to make the personal political, collectively speeding up the closing of the American mind (as a different Bloom put it).<\/p>\n<p>Amid this partisan acceleration, Bloom pauses the process to re-instill unashamed love for American art into the culture. He calls us to think of Emily Dickinson as Shakespeare\u2019s equal. <em>The American Canon<\/em> is an affectionate telling of our literary past, unapologetic in its patriotism, even through Bloom\u2019s New Age-ism. Defying the intersectional critique of the Western canon as a museum of \u201c<a href=\"https:\/\/www.huffpost.com\/entry\/when-booting-dead-white-guys-off-reading-lists-is-a-good-idea_n_59f29887e4b03cd20b80a874?guccounter=1&amp;guce_referrer=aHR0cHM6Ly93d3cuZ29vZ2xlLmNvbS8&amp;guce_referrer_sig=AQAAAK2zc0K1TEFzU-9nf97yZJFoKqMgBOnwADHnRnEBSzLC3u4FkXMs75pWSgxOfp8g0uUvT39V3U2bGni0hXwR4uteU8Dv4N2gcQsPckBVQHaY1Hlz16QJoe-fKzmOGAcrUj-Zl4bOPMQ_HBcDzddrRo1rhDGevE2Cu3cGRh4XhTOD\" target=\"_blank\" rel=\"noopener noreferrer\">dead white males<\/a>,\u201d the book contains a diverse array of authors. While Bloom is enamored of Herman Melville, he also finds Melville\u2019s female contemporaries unmatched. He speaks with equal affection for James Baldwin and Nathaniel Hawthorne. In this way, Bloom is the ideal intellectual in the era of cancellation: He points out quality where he sees it, without regard for group identity.<\/p>\n<p><em>The American Canon<\/em> is a great collection, in part because it\u2019s the only recent work of literary criticism that showcases the foregone virtue of American optimism. What other academic would say, as Bloom does when describing how it feels to read Whitman, \u201cPerfection is now and in America\u201d?<\/p>\n","protected":false},"excerpt":{"rendered":"<p>The late Bloom\u2019s New Age leftist patriotism made him un-cancellable within his own camp.<\/p>\n","protected":false},"author":127,"featured_media":799888,"comment_status":"open","ping_status":"closed","sticky":false,"template":"","format":"standard","meta":{"hide-more-from-author":false,"disable-remixd":false,"hide_top_stories":false,"_links_to":"","_links_to_type":0,"original-print-title":"","hide-nrplus":"1","social":{"tweet":"","share-chart":false}},"categories":[5315,6932,1290],"tags":[3597],"section":[615],"jetpack_featured_media_url":"https:\/\/www.nationalreview.com\/wp-con
