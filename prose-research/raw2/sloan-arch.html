// <libby-panel>

class LibbyPanel extends HTMLElement {
  constructor() {
    super();
    document.addEventListener("DOMContentLoaded", () => {
      this.loadData();
    })
  }

  async loadData() {
    const now = Math.floor(Date.now() / 1000.0); // seconds

    const cachedString = localStorage.getItem("libby-stats");
    if (cachedString) {
      const cached = JSON.parse(cachedString);
      await this.displayCounts(cached.data);
      if ((now - Number(cached.fetched)) < 43200) {
        console.log("using cached libby data");
        return;
      }
    }

    const response =
      await fetch("https://robinsloan-getlibbystats.web.val.run");

    if (response.ok) {
      const data = await response.json();
      await this.displayCounts(data);
      const cache = { data: data, fetched: now };
      localStorage.setItem("libby-stats", JSON.stringify(cache));
    }
  }

  async displayCounts(data) {
    for (const key in data) {
      const element = this.querySelector(`book-data#${key}`);
      if (element) {
        element.querySelector("book-count").innerHTML = data[key];
      }
    }
  }
}

customElements.define("libby-panel", LibbyPanel);

Hack.tweakHangingChars = function (paragraph) {
  const EPSILON = 4.0;
  const paragraphRect = paragraph.getBoundingClientRect();
  const leftEdge = paragraphRect.left;
  const rightEdge = paragraphRect.right;

  const charsToHangLeft = new Set(["(", "“", "T", "Y", "V", "W"]);
  // note below, that is: em, en, dash :)
  const charsToHangRight = new Set([",", ")", "”", "—", "–", "-"]);

  // walk through text nodes
  const walker = document.createTreeWalker(
    paragraph,
    NodeFilter.SHOW_TEXT,
    null,
  );

  let textNode;

  while (textNode = walker.nextNode()) {
    if ((textNode.parentElement.className == "hang-left") ||
      (textNode.parentElement.className == "hang-left")) {
      continue;
    }

    const text = textNode.textContent;

    for (let pos = 0; pos < text.length; pos++) {
      if (pos >= text.length) {
        break;
      }

      const currentChar = text[pos];

      if (charsToHangLeft.has(currentChar)) {
        const range = document.createRange();
        range.setStart(textNode, pos);
        range.setEnd(textNode, pos + 1);
        const rect = range.getBoundingClientRect();

        if (Math.abs(rect.left - leftEdge) < EPSILON) {
          const span = document.createElement("span");
          span.classList.add("hang-left");
          if (Hack.VISUALIZE) { span.style.backgroundColor = "#0f0"; }
          span.textContent = currentChar;

          // replace text range with span
          range.deleteContents();
          range.insertNode(span);

          // this is where we start to get sort of insane --
          // but we need to wait for layout reflow to check our work.
          // the only way out is through!!
          setTimeout(() => {
            const newRect = span.getBoundingClientRect();
            if (newRect.left > (leftEdge + EPSILON)) {
              // oops, my mod just yanked this out of alignment
              span.classList.remove("hang-left");
              if (Hack.VISUALIZE) { span.style.backgroundColor = "#f00"; }
            }
          }, 50); // TODO maybe this delay can be much shorter

          textNode = walker.nextNode();
          break; // from for loop
        }
      }

      // sadly, this was not really working

      // if (charsToHangRight.has(currentChar)) {
      //   const range = document.createRange();
      //   range.setStart(textNode, pos);

      //     textNode = walker.nextNode();

  }

// video stuff

var VideoHandler = {};
var V = VideoHandler;

var videoCurrentlyPlaying;
var globallyUnmuted = false;

VideoHandler.playVideo = function (video) {
  if (videoCurrentlyPlaying && videoCurrentlyPlaying !== video) {
    videoCurrentlyPlaying.muted = true;
  }

  video.play();
  videoCurrentlyPlaying = video;

  /*
  // this messes with mobile playback
  // i.e. when a video is unmuted, it can't autoplay
  if (globallyUnmuted) {
    video.muted = false;
  }
  */
}

VideoHandler.pauseVideo = function (video) {
  video.pause();
  if (videoCurrentlyPlaying === video) {
    videoCurrentlyPlaying = null;
  }
}

const videoIntersectionOptions = {
  root: document.querySelector("main"),
  rootMargin: "0px",
  threshold: 0.333
}

function videoIntersectionHandler(entries) {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      V.playVideo(entry.target);
    } else {
      V.pauseVideo(entry.target);
    }
  });
}

VideoHandler.setupVideoPlayers = async function () {
  let videos = document.querySelectorAll("video");

  if (videos.length == 0) { return; }

  let videoObserver = new IntersectionObserver(videoIntersectionHandler, videoIntersectionOptions);

  videos.forEach(video => {
    video.pause();

    if (IS_SAFARI) {
      // this was causing trouble with iPhones on low power mode...
      // video.removeAttribute("controls");
    }

    // this doesn't work on Safari, for unknown reasons!
    let captions = video.textTracks[0];
    if (captions) {
      captions.mode = "hidden";
    }

    video.addEventListener("click", e => {
      let v = e.target;
      v.muted = !v.muted;
      // globallyUnmuted = !v.muted;
      e.preventDefault();
    });

    videoObserver.observe(video);
  });
}
